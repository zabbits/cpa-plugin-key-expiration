name: Linux build and release
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Linux ${{ matrix.arch }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate release version
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import tomllib

          version = tomllib.loads(Path('Cargo.toml').read_text())['package']['version']
          expected = f'v{version}'
          if os.environ['RELEASE_TAG'] != expected:
              raise SystemExit(f'Release tag must match Cargo.toml version: {expected}')
          PY
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Check Rust formatting and lints
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets --target ${{ matrix.target }} -- -D warnings
      - name: Run tests
        run: cargo test --locked --target ${{ matrix.target }}
      - name: Check frontend scripts
        run: |
          node --check web/app.js
          node --check web/panel.js
          node --check web/calendar.js
      - name: Build and package
        run: python scripts/package.py --target ${{ matrix.target }}
      - name: Verify package checksums
        working-directory: dist
        run: sha256sum --check *.zip.sha256
      - name: Upload Linux package
        uses: actions/upload-artifact@v7
        with:
          name: key-expiration-linux-${{ matrix.arch }}
          path: |
            dist/*_linux_${{ matrix.arch }}.zip
            dist/*_linux_${{ matrix.arch }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download Linux packages
        uses: actions/download-artifact@v8
        with:
          pattern: key-expiration-linux-*
          merge-multiple: true
          path: dist
      - name: Verify release assets
        working-directory: dist
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          for arch in amd64 arm64; do
            archive="key-expiration_${version}_linux_${arch}.zip"
            test -f "$archive"
            sha256sum --check "$archive.sha256"
          done
      - name: Publish release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            dist/*_linux_amd64.zip
            dist/*_linux_amd64.zip.sha256
            dist/*_linux_arm64.zip
            dist/*_linux_arm64.zip.sha256
