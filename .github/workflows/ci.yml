name: Linux build
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Linux ${{ matrix.arch }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Check Rust formatting and lints
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets --target ${{ matrix.target }} -- -D warnings
      - name: Run tests
        run: cargo test --locked --target ${{ matrix.target }}
      - name: Check frontend scripts
        run: |
          node --check web/app.js
          node --check web/panel.js
          node --check web/calendar.js
      - name: Build and package
        run: python scripts/package.py --target ${{ matrix.target }}
      - name: Verify package checksums
        working-directory: dist
        run: sha256sum --check *.zip.sha256
      - name: Upload Linux package
        uses: actions/upload-artifact@v7
        with:
          name: key-expiration-linux-${{ matrix.arch }}
          path: |
            dist/*_linux_${{ matrix.arch }}.zip
            dist/*_linux_${{ matrix.arch }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
